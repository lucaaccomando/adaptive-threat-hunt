<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Anomaly View — Adaptive Threat Hunt</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.7rem;
    }
    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #374151;
      margin-bottom: 0.75rem;
      margin-right: 0.5rem;
    }
    .btn:hover {
      background: #1f2937;
    }
    .btn-active {
      background: #2563eb;
      border-color: #2563eb;
    }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem 0 1.5rem 0;
    }
    .summary-card {
      min-width: 160px;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: #020617;
      border: 1px solid #1f2937;
      font-size: 0.9rem;
    }
    .summary-label {
      color: #9ca3af;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .summary-value {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.15rem;
    }
    .table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #1f2937;
      background: #020617;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }
    thead {
      background: #0f172a;
    }
    th, td {
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid #1f2937;
      text-align: left;
      white-space: nowrap;
    }
    tbody tr:nth-child(even) {
      background: #020617;
    }
    tbody tr:nth-child(odd) {
      background: #030712;
    }
    tbody tr td:last-child {
      font-weight: 600;
    }
    .tag-anom {
      color: #fecaca;
    }
    .tag-normal {
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="{{ url_for('index') }}" class="btn">← Back to dashboard</a>
    <h1>Top Anomalous Flows</h1>

    <div>
      <a href="{{ url_for('anomalies', view='anom') }}"
         class="btn {% if view_mode == 'anom' %}btn-active{% endif %}">
        Only anomalies
      </a>
      <a href="{{ url_for('anomalies', view='all') }}"
         class="btn {% if view_mode == 'all' %}btn-active{% endif %}">
        All flows
      </a>
      <a href="{{ url_for('download_anomalies') }}" class="btn">
        Download anomalies CSV
      </a>
    </div>

    <div class="summary">
      <div class="summary-card">
        <div class="summary-label">Total flows</div>
        <div class="summary-value">{{ total_flows }}</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Anomalies</div>
        <div class="summary-value">{{ num_anomalies }}</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Anomaly rate</div>
        <div class="summary-value">{{ percent_anomalies }}%</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Rows shown</div>
        <div class="summary-value">{{ rows_shown }}</div>
      </div>
    </div>

    <div class="table-wrapper">
      {{ table_html|safe }}
    </div>
  </div>
</body>
</html>
