<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Adaptive Threat Hunt{% endblock %}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1120;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1f2933;
      box-shadow: 0 20px 30px rgba(0,0,0,0.4);
    }
    h1 { margin-top: 0; font-size: 1.8rem; }
    p { color: #9ca3af; }
    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid #374151;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      background: #111827;
      color: #e5e7eb;
      margin-bottom: 0.75rem;
      margin-right: 0.5rem;
    }
    .btn:hover { background: #1f2937; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem 0 1.5rem 0;
    }
    .summary-card {
      min-width: 160px;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: #020617;
      border: 1px solid #1f2937;
      font-size: 0.9rem;
    }
    .summary-label {
      color: #9ca3af;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .summary-value {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.15rem;
    }
    {% block styles %}{% endblock %}
  </style>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
